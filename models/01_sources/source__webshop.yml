version: 2

sources:
  - name: webshop
    description: "Test system for the MCP test pass"
    database: raw
    schema: webshop
    tables:
      - name: web_customer
        description: "Shop accounts"
        columns:
          - name: account_id
            data_type: VARCHAR(36)
          - name: display_name
            data_type: VARCHAR(200)
          - name: email
            data_type: VARCHAR(255)
            description: "Login email"
          - name: marketing_opt_in
            data_type: BOOLEAN
          - name: tpch_custkey
            data_type: NUMBER(38,0)
          - name: updated_at
            data_type: TIMESTAMP_NTZ
      - name: web_order
        description: "Source table from WEBSHOP"
        columns:
          - name: account_id
            data_type: VARCHAR(36)
          - name: channel
            data_type: VARCHAR(20)
          - name: placed_at
            data_type: TIMESTAMP_NTZ
          - name: status
            data_type: VARCHAR(20)
          - name: total_amount
            data_type: NUMBER(12,2)
          - name: tpch_orderkey
            data_type: NUMBER(38,0)
          - name: web_order_id
            data_type: VARCHAR(36)
      - name: web_order_item
        description: "Source table from WEBSHOP"
        columns:
          - name: line_no
            data_type: NUMBER(5,0)
          - name: quantity
            data_type: NUMBER(10,0)
          - name: tpch_partkey
            data_type: NUMBER(38,0)
          - name: unit_price
            data_type: NUMBER(12,2)
          - name: web_order_id
            data_type: VARCHAR(36)
      - name: web_session
        description: "Source table from WEBSHOP"
        columns:
          - name: account_id
            data_type: VARCHAR(36)
          - name: session_id
            data_type: VARCHAR(64)
          - name: started_at
            data_type: TIMESTAMP_NTZ
          - name: user_agent
            data_type: VARCHAR(1000)
