version: 2

models:
  - name: web_order_s_v1
    description: "Standard satellite v1 (with load_end_date) for web_order_h"
    config:
      tags: ['satellite', 'v1', 'raw_vault', 'WebShop']
    columns:
      - name: hk_web_order_h
        description: "Parent entity hash key"
        data_tests:
          - not_null
      - name: hd_web_order_s
        description: "Hash diff for change detection"
      - name: channel
        description: "Payload column"
      - name: status
        description: "Payload column"
      - name: total_amount
        description: "Payload column"
      - name: placed_at
        description: "Payload column"
      - name: ldts
        description: "Load date timestamp"
      - name: load_end_date
        description: "Load end date (when this version was superseded)"
      - name: is_current
        description: "Flag indicating if this is the current version"
