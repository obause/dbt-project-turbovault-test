      tags: ['satellite', 'v1', 'raw_vault', 'Test']
    columns:
      - name: HK_NATION_H
        description: "Parent entity hash key"
        data_tests:
          - not_null
      - name: hd_nation_s
        description: "Hash diff for change detection"
